<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <script src='https://cdn.tailwindcss.com'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'></script>
        <link rel='preconnect' href='https://fonts.googleapis.com'>
        <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
        <link href='https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap' rel='stylesheet'>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'Prompt', 'sans-serif'],
                        }
                    }
                }
            }
        </script>

        <title>Scramble Manager</title>
    </head>
    <!-- Changed body background to very dark slate and default text to light gray -->
    <body class='bg-slate-950 font-sans text-slate-300 antialiased'>
        <div id='toast-container' class='fixed bottom-5 right-5 z-50 flex flex-col gap-3 pointer-events-none'></div>
        <div class='min-h-screen flex flex-col items-center justify-start py-12 px-4'>
            
            <!-- Main Container: Darkened card, adjusted border and shadow -->
            <div class='w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-8 border border-slate-800'>
                
                <header class='mb-10 text-center'>
                    <h1 class='text-3xl font-extrabold tracking-tight text-white'>
                        Scramble Manager
                    </h1>
                    <p class='text-slate-400 mt-2 text-sm'>
                        Local processing for privacy & speed
                    </p>
                </header>

                <div class='space-y-8'>
                    <!-- WCIF Loader Section -->
                    <section>
                        <h2 class='text-xs font-semibold uppercase tracking-wider text-slate-500 mb-4'>
                            Competition Data
                        </h2>
                        <form class='flex flex-col gap-3'>
                            <div>
                                <label for='competition-id' class='block text-sm font-medium mb-1.5 ml-1 text-slate-300'>
                                    Competition ID
                                </label>
                                <!-- Darkened input field -->
                                <input 
                                    type='text' 
                                    name='competition-id' 
                                    id='competition-id'
                                    placeholder='e.g. ThailandChampionship2026'
                                    class='w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-600'
                                />
                            </div>
                            <!-- Button stays vibrant blue for contrast -->
                            <button id='load-wcif-button' type='button' class='w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98]'>
                                Load WCIF
                            </button>
                        </form>
                    </section>

                    <hr class='border-slate-800' />

                    <!-- File Upload Section -->
                    <section>
                        <h2 class='text-xs font-semibold uppercase tracking-wider text-slate-500 mb-4'>
                            Process Scrambles
                        </h2>
                        <form class='flex flex-col gap-3'>
                            <div>
                                <label for='scramble-file' class='block text-sm font-medium mb-1.5 ml-1 text-slate-300'>
                                    Scramble File (.zip)
                                </label>
                                <!-- Darkened file input with adjusted button colors -->
                                <input 
                                    type='file' 
                                    name='scramble-file' 
                                    id='scramble-file'
                                    class='w-full text-sm text-slate-400 
                                           file:mr-4 file:py-2 file:px-4 
                                           file:rounded-full file:border-0 
                                           file:text-sm file:font-semibold 
                                           file:bg-blue-500/10 file:text-blue-400 
                                           hover:file:bg-blue-500/20
                                           cursor-pointer bg-slate-950 rounded-xl border border-dashed border-slate-700 p-2 transition-colors'
                                />
                            </div>
                            <!-- Reorganize button changed to a lighter slate to stand out against the dark card -->
                            <button id='reorganize-button' type='button' class='w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold py-2.5 rounded-xl shadow-lg transition-all active:scale-[0.98]'>
                                Reorganize & Zip
                            </button>
                        </form>
                    </section>
                </div>

                <!-- Footer Note: Adjusted for dark mode contrast -->
                <footer class='mt-10 pt-6 border-t border-slate-800 text-center'>
                    <div class='inline-flex items-center px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase tracking-widest'>
                        <span class='w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 shadow-[0_0_8px_rgba(52,211,153,0.8)]'></span>
                        Local Browser Processing
                    </div>
                </footer>

            </div>
        </div>
    </body>
    <script type='module' src='scripts/index.js'></script>
</html>
